name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Gerar cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ArrudaGabrielpht
          outputs: |
            github-contribution-grid-snake.svg

      - name: Publicar na gh-pages
        uses: EndBug/add-and-commit@v9
        with:
          add: "github-contribution-grid-snake.svg"
          message: "chore: atualizar cobrinha"
          branch: gh-pages
          default_author: github_actions
