name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Gerar cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ArrudaGabrielpht
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar arquivos
        uses: EndBug/add-and-commit@v9
        with:
          add: "dist"
          message: "chore: atualizar github snake"
          default_author: github_actions
